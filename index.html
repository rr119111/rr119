<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>백은의 별</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#e8edf7;font-family:system-ui,sans-serif}header{text-align:center;padding:75px 20px 48px;background:radial-gradient(ellipse at top,#34435e,transparent 75%)}header small{letter-spacing:.35em;color:#a6b7d1}h1{font-family:Georgia,'Batang',serif;font-size:clamp(36px,8vw,60px);font-weight:400;letter-spacing:.15em;margin:18px 0}header p,footer,.muted{color:#a6b7d1}main{max-width:760px;margin:auto;padding:24px 18px 60px}h2{font-size:18px;letter-spacing:.1em}button{font:inherit;color:inherit;cursor:pointer;background:#202b3e;border:1px solid #3b4960;border-radius:8px;padding:12px 16px}button:disabled{opacity:.35;cursor:default}.episode{display:flex;width:100%;align-items:center;gap:18px;text-align:left;margin:12px 0;padding:12px}.thumb{width:90px;height:100px;object-fit:cover;border-radius:5px;background:#303e55;flex-shrink:0}.placeholder{display:grid;place-items:center;color:#c3d0e4;font-size:30px;flex-shrink:0}.episode strong{display:block;margin:8px 0}.episode span:last-child{margin-left:auto}nav{display:flex;justify-content:space-between;gap:8px;margin:24px 0}.pages img{display:block;width:100%;height:auto;margin:0 auto}.pages{background:#fff}.notice{padding:32px;text-align:center;color:#a6b7d1;background:#202b3e}footer{text-align:center;padding:25px;font-size:12px;letter-spacing:.1em}a{color:inherit}[hidden]{display:none!important}
.genre-tag{display:inline-block;padding:6px 14px;border:1px solid #414c6a;border-radius:30px;background:rgba(168,185,238,.05);color:#b8c5e4;font-size:12px}
.list-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sort{display:flex;gap:4px;margin-left:auto}.sort button{font-size:12px;padding:7px 10px;background:transparent;border-color:transparent;color:#a6b7d1}.sort button[aria-pressed="true"]{background:#303e55;border-color:#536581;color:#e8edf7}
</style>
</head>
<body>
<header>
  <small>✦</small>
  <h1>백은의 별</h1>
  <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:24px 0">
    <span class="genre-tag">#현대판타지</span>
    <span class="genre-tag">#헌터물</span>
    <span class="genre-tag">#액션</span>
    <span class="genre-tag">#미스터리</span>
  </div>
  <small style="font-size:11px">작가 루아</small>
</header>
<main>
  <section id="list"><div class="list-heading"><h2>EPISODES · 회차 목록</h2><div class="sort" role="group" aria-label="회차 정렬"><button id="latest" aria-pressed="true">최신순</button><button id="first" aria-pressed="false">첫회차순</button></div></div><div id="episodes"></div></section>
  <section id="reader" hidden>
    <button onclick="location.hash=''">← 전체 목록</button>
    <h2 id="episodeTitle"></h2>
    <div class="pages" id="pages"></div>
    <nav><button id="prev">← 이전 화</button><button onclick="location.hash=''">목록</button><button id="next">다음 화 →</button></nav>
  </section>
</main>
<footer>✧ &nbsp; 백은의 별 · 작가 루아 &nbsp; ✧</footer>
<script>
// 회차 추가: 이미지 파일은 index.html과 같은 위치에 업로드하세요.
const episodes = [
  {title:'제01화:백은의 공주', thumbnail:'ep01-01.png', image:['ep01-01.png', 'ep01-02.png', 'ep01-03.png', 'ep01-04.png']},
  {title:'제02화:변화의 조짐', thumbnail:'ep02-01.png', image:['ep02-01.png', 'ep02-02.png', 'ep02-03.png', 'ep02-04.png']},
  {title:'제03화:이상현상', thumbnail:'ep03-01.png', image:['ep03-01.png', 'ep03-02.png', 'ep03-03.png', 'ep03-04.png', 'ep03-05.png', 'ep03-06.png']},
  {title:'제04화:이상 신호', thumbnail:'thumb04.jpg', image:'ep04.jpg'},
  {title:'제05화:보이지 않는 추적자', thumbnail:'thumb05.jpg', image:'ep05.jpg'},
  {title:'제06화:백운산의 기록', thumbnail:'thumb06.jpg', image:'ep06.jpg'},
  {title:'제07화:조각을 쫓는 자들', thumbnail:'thumb07.jpg', image:'ep07.jpg'},
  {title:'제08화:네 번째 잔해', thumbnail:'thumb08.jpg', image:'ep08.jpg'},
  {title:'제09화:마지막 한 사람', thumbnail:'thumb09.jpg', image:'ep09.jpg'},
  // 새 회차는 아래에 추가하세요.
];
const $ = id => document.getElementById(id);
let order='latest';
function setOrder(value){order=value;renderList()}
$('latest').onclick=()=>setOrder('latest');
$('first').onclick=()=>setOrder('first');
function go(i){location.hash='episode-'+(i+1)}
function placeholder(){const d=document.createElement('div');d.className='thumb placeholder';d.textContent='✦';return d}
function notice(message){const n=document.createElement('div');n.className='notice';n.textContent=message;return n}
function renderList(){
  $('latest').setAttribute('aria-pressed',String(order==='latest'));
  $('first').setAttribute('aria-pressed',String(order==='first'));
  $('episodes').replaceChildren();
  const items=episodes.map((e,j)=>({e,j}));
  if(order==='latest')items.reverse();
  items.forEach(({e,j})=>{
    const b=document.createElement('button');b.className='episode';b.onclick=()=>go(j);
    let thumb=placeholder();
    if(e.thumbnail){thumb=document.createElement('img');thumb.className='thumb';thumb.alt='';thumb.onerror=()=>thumb.replaceWith(placeholder());thumb.src=e.thumbnail}
    const t=document.createElement('div');const s=document.createElement('small');s.className='muted';s.textContent='EPISODE '+String(j+1).padStart(2,'0');
    const strong=document.createElement('strong');strong.textContent=e.title;t.append(s,strong);
    const arrow=document.createElement('span');arrow.textContent='›';b.append(thumb,t,arrow);$('episodes').append(b);
  });
}
function render(){
  const m=location.hash.match(/^#episode-(\d+)$/);
  const i=m?Number(m[1])-1:-1;
  const ep=episodes[i];
  $('list').hidden=!!ep;$('reader').hidden=!ep;
  if(!ep){renderList()}
  else{
    $('episodeTitle').textContent=ep.title;$('pages').replaceChildren();
if(ep.image){
  const images = Array.isArray(ep.image) ? ep.image : [ep.image];
  images.forEach(src => {
    const img = document.createElement('img');
    img.alt = ep.title;
    img.onerror = () => img.replaceWith(notice('만화 이미지를 불러올 수 없습니다.'));
    img.src = src;
    $('pages').append(img);
  });
}
else{
  $('pages').append(notice('아직 등록된 만화 이미지가 없습니다.'));
}
    $('prev').disabled=i===0;$('next').disabled=i===episodes.length-1;$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
